<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 90" width="100%" height="100%">
  <style>
    .tech-text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #10D000; letter-spacing: 0px; }
    .bridge-text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #12169C; letter-spacing: 0px; }
  </style>

  <!-- TECH in Lime Green -->
  <text x="0" y="60" class="tech-text">TECH</text>

  <!-- BRIDGE in Deep Blue -->
  <text x="145" y="60" class="bridge-text">BRIDGE</text>

  <!-- Emblem Icon (Right) -->
  <g transform="translate(445, 10)">
    <!-- Vertical Spine Line in Deep Blue -->
    <line x1="20" y1="5" x2="20" y2="65" stroke="#12169C" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Top Branch & Circle in Deep Blue -->
    <path d="M 20 20 L 35 20 L 35 12" fill="none" stroke="#12169C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="12" r="5" fill="#12169C"/>

    <!-- Middle Branch & Circle in Lime Green -->
    <line x1="5" y1="35" x2="38" y2="35" stroke="#10D000" stroke-width="5" stroke-linecap="round"/>
    <circle cx="43" cy="35" r="7" fill="#10D000"/>

    <!-- Bottom Branch & Circle in Deep Blue -->
    <path d="M 20 50 L 35 50 L 35 58" fill="none" stroke="#12169C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="58" r="5" fill="#12169C"/>
  </g>
</svg>
