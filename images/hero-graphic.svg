<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10D000"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="hero-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B38F0"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080A12" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Glowing Spheres -->
  <circle cx="150" cy="120" r="100" fill="#10D000" opacity="0.15" filter="blur(40px)" />
  <circle cx="450" cy="350" r="120" fill="#2B38F0" opacity="0.2" filter="blur(50px)" />

  <!-- Code Window Card (Web Dev) -->
  <g transform="translate(30, 40)" filter="url(#shadow)">
    <rect width="320" height="240" rx="16" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Controls -->
    <circle cx="24" cy="24" r="6" fill="#FF5F56"/>
    <circle cx="44" cy="24" r="6" fill="#FFBD2E"/>
    <circle cx="64" cy="24" r="6" fill="#10D000"/>
    <text x="90" y="28" font-family="monospace" font-size="12" fill="#64748B">index.html — Web Development</text>
    <line x1="0" y1="44" x2="320" y2="44" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Code Mockup -->
    <text x="20" y="75" font-family="'Fira Code', monospace" font-size="13" fill="#F43F5E">&lt;div <tspan fill="#60A5FA">class</tspan>=<tspan fill="#FACC15">"internship"</tspan>&gt;</text>
    <text x="40" y="100" font-family="'Fira Code', monospace" font-size="13" fill="#E2E8F0">&lt;h1&gt;<tspan fill="#10D000">Build Real Projects</tspan>&lt;/h1&gt;</text>
    <text x="40" y="125" font-family="'Fira Code', monospace" font-size="13" fill="#60A5FA">&lt;p&gt;<tspan fill="#94A3B8">30-Day Practical Internship</tspan>&lt;/p&gt;</text>
    <text x="40" y="150" font-family="'Fira Code', monospace" font-size="13" fill="#10D000">&lt;button <tspan fill="#FACC15">onclick</tspan>=<tspan fill="#FACC15">"apply()"</tspan>&gt;</text>
    <text x="60" y="175" font-family="'Fira Code', monospace" font-size="13" fill="#10D000">Launch Career &amp; Get Certified ✨</text>
    <text x="40" y="200" font-family="'Fira Code', monospace" font-size="13" fill="#10D000">&lt;/button&gt;</text>
    <text x="20" y="222" font-family="'Fira Code', monospace" font-size="13" fill="#F43F5E">&lt;/div&gt;</text>
  </g>

  <!-- Data Analytics Card -->
  <g transform="translate(240, 220)" filter="url(#shadow)">
    <rect width="330" height="240" rx="16" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#F8FAFC">Data Analytics Track</text>
    <text x="24" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Real-World Insights &amp; Analytics</text>
    
    <!-- Mini Charts -->
    <g transform="translate(24, 75)">
      <rect x="0" y="60" width="18" height="50" rx="4" fill="url(#hero-grad1)"/>
      <rect x="26" y="30" width="18" height="80" rx="4" fill="url(#hero-grad1)"/>
      <rect x="52" y="45" width="18" height="65" rx="4" fill="url(#hero-grad1)"/>
      <rect x="78" y="10" width="18" height="100" rx="4" fill="url(#hero-grad2)"/>
      <rect x="104" y="25" width="18" height="85" rx="4" fill="url(#hero-grad2)"/>
      
      <path d="M 9 50 L 35 25 L 61 38 L 87 5 L 113 18" fill="none" stroke="#10D000" stroke-width="3" stroke-linecap="round"/>
      <circle cx="87" cy="5" r="5" fill="#10D000"/>
    </g>

    <!-- Key Metrics Widget -->
    <g transform="translate(170, 75)">
      <rect width="136" height="60" rx="10" fill="#080A12" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" font-family="sans-serif" font-size="10" fill="#94A3B8">Practical Projects</text>
      <text x="14" y="46" font-family="sans-serif" font-weight="800" font-size="18" fill="#10D000">100% Real</text>
    </g>
    <g transform="translate(170, 145)">
      <rect width="136" height="60" rx="10" fill="#080A12" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" font-family="sans-serif" font-size="10" fill="#94A3B8">Duration</text>
      <text x="14" y="46" font-family="sans-serif" font-weight="800" font-size="18" fill="#60A5FA">30 Days</text>
    </g>
  </g>

  <!-- Recommendation Badge Overlay -->
  <g transform="translate(45, 300)" filter="url(#shadow)">
    <rect width="210" height="80" rx="14" fill="#080A12" stroke="#10D000" stroke-width="2"/>
    <circle cx="45" cy="40" r="22" fill="#10D000"/>
    <polygon points="45,26 49,34 58,35 51,41 53,50 45,45 37,50 39,41 32,35 41,34" fill="#080A12"/>
    <text x="80" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Recommendation</text>
    <text x="80" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#10D000">Official Letter</text>
    <text x="80" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">For top performers</text>
  </g>
</svg>
