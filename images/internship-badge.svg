<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10D000"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E25C7"/>
    </linearGradient>
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#badge-grad)" stroke-width="4" filter="url(#badge-glow)" opacity="0.6"/>
  <circle cx="150" cy="150" r="120" fill="#080A12" stroke="url(#badge-grad)" stroke-width="3"/>
  <circle cx="150" cy="150" r="105" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6,4"/>

  <path id="text-path" d="M 60 150 A 90 90 0 0 1 240 150" fill="none"/>
  <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#10D000" letter-spacing="3">
    <textPath href="#text-path" startOffset="50%" text-anchor="middle">
      PRACTICAL INTERNSHIP
    </textPath>
  </text>

  <g transform="translate(150, 140)">
    <text x="0" y="-10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle">30</text>
    <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="url(#badge-grad)" text-anchor="middle" letter-spacing="2">DAYS</text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#94A3B8" text-anchor="middle">HANDS-ON</text>
  </g>

  <g transform="translate(150, 215)">
    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="url(#badge-grad)"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">VERIFIED CERTIFICATE</text>
  </g>
</svg>
